name: Build y push a GHCR

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cicd-front
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Producción (Oracle E2.1.Micro) es amd64. La leg arm64 falla al
          # compilar `next/font/google` bajo QEMU (Turbopack no resuelve el
          # módulo interno de fuentes), así que se publica solo amd64.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}